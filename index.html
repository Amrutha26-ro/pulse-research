<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse - Research Intelligence Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 2rem; }
    .container { max-width: 850px; margin: 0 auto; }
    header { margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; }
    header h1 { color: #7eb900; font-size: 2.2rem; }
    header p { color: #94a3b8; }
    .nav-buttons { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    button { background-color: #7eb900; color: #0f172a; padding: 0.6rem 1.2rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .card { background-color: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #334155; }
    input, textarea { width: 100%; padding: 0.75rem; margin-top: 0.4rem; margin-bottom: 1rem; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; }
    .paper-item { border-left: 4px solid #7eb900; margin-top: 1rem; }
    .meta { color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .tags { display: inline-block; background: #334155; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-top: 0.5rem; }
    a { color: #7eb900; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pulse</h1>
      <p>Accelerating the future of academic research</p>
    </header>

    <div class="nav-buttons">
      <button onclick="switchTab('repo')">View Repository</button>
      <button onclick="switchTab('publish')">Publish Paperwork</button>
      <button onclick="switchTab('search')">Search External (arXiv)</button>
    </div>

    <!-- View Repository Section -->
    <div id="tab-repo">
      <h2>Research Repository</h2>
      <div id="repo-list">Loading papers...</div>
    </div>

    <!-- Publish Section -->
    <div id="tab-publish" class="card hidden">
      <h2>Publish Research Paperwork</h2>
      <form id="publish-form" onsubmit="handlePublish(event)">
        <label>Title</label>
        <input type="text" id="pub-title" required>
        <label>Authors</label>
        <input type="text" id="pub-authors" required>
        <label>Document / PDF URL</label>
        <input type="url" id="pub-url">
        <label>Tags (comma separated)</label>
        <input type="text" id="pub-tags">
        <label>Abstract / Insights</label>
        <textarea id="pub-abstract" rows="4" required></textarea>
        <button type="submit">Publish to Pulse</button>
      </form>
    </div>

    <!-- Search Section -->
    <div id="tab-search" class="hidden">
      <div class="card">
        <h2>Search External Papers</h2>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="search-input" placeholder="Search machine learning, physics, NLP...">
          <button style="height: 42px; margin-top: 6px;" onclick="handleSearch()">Search</button>
        </div>
      </div>
      <div id="search-list"></div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000/api";

    function switchTab(tabName) {
      document.getElementById('tab-repo').classList.add('hidden');
      document.getElementById('tab-publish').classList.add('hidden');
      document.getElementById('tab-search').classList.add('hidden');

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      if (tabName === 'repo') fetchRepo();
    }

    async function fetchRepo() {
      const container = document.getElementById('repo-list');
      container.innerHTML = '<p class="meta">Loading...</p>';
      try {
        const res = await fetch(`${API_BASE}/papers?t=${Date.now()}`, { cache: 'no-store' });
        const papers = await res.json();
        renderPapers(papers, container);
      } catch (err) {
        container.innerHTML = '<p class="meta">Make sure backend server is running (python server.py)</p>';
      }
    }

    async function handlePublish(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('pub-title').value,
        authors: document.getElementById('pub-authors').value,
        url: document.getElementById('pub-url').value,
        tags: document.getElementById('pub-tags').value,
        abstract: document.getElementById('pub-abstract').value
      };

      await fetch(`${API_BASE}/papers`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      document.getElementById('publish-form').reset();
      switchTab('repo');
    }

    async function handleSearch() {
      const query = document.getElementById('search-input').value;
      if (!query) return;
      const container = document.getElementById('search-list');
      container.innerHTML = '<p class="meta">Searching arXiv...</p>';
      try {
        const res = await fetch(`${API_BASE}/search/external?query=${encodeURIComponent(query)}&t=${Date.now()}`, { cache: 'no-store' });
        const papers = await res.json();
        renderPapers(papers, container);
      } catch (err) {
        container.innerHTML = '<p class="meta">Error performing search.</p>';
      }
    }

    function renderPapers(papers, container) {
      if (!papers.length) {
        container.innerHTML = '<p class="meta">No research papers found.</p>';
        return;
      }
      container.innerHTML = papers.map(p => `
        <div class="card paper-item">
          <h3>${p.title}</h3>
          <p class="meta">By: ${p.authors}</p>
          <p>${p.abstract}</p>
          ${p.tags ? `<span class="tags">${p.tags}</span>` : ''}
          ${p.url ? `<div style="margin-top:0.5rem"><a href="${p.url}" target="_blank">View Paper →</a></div>` : ''}
        </div>
      `).join('');
    }

    // Initial load
    fetchRepo();
  </script>
</body>
</html>
